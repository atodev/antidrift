[project]
name = "hamiltonian"
version = "0.1.0"
description = "Intent-Hamiltonian monitor for agentic and self-improving workloads"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamiltonian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
